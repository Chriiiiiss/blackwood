name: Production integration CI

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/api/**
      - Dockerfile
      - .dockerignore
      - compose.production.yaml
      - deploy/**
      - .env.production.example
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - .env.example
      - tsconfig.base.json
      - biome.json
      - .github/workflows/ci-production.yml
      - .github/workflows/deploy.yml
  pull_request:
    paths:
      - apps/web/package.json
      - apps/api/package.json
      - apps/api/drizzle/**
      - Dockerfile
      - .dockerignore
      - compose.production.yaml
      - deploy/**
      - .env.production.example
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - .env.example
      - tsconfig.base.json
      - biome.json
      - .github/workflows/ci-production.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production containers and real submissions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium dependencies
        run: pnpm --filter @blackwood/web exec playwright install --with-deps chromium

      - name: Test deployment safeguards
        run: python3 -m unittest discover -s deploy -p 'test_*.py'

      - name: Authenticate Docker Hub image downloads
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Configure the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets." >&2
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Verify production containers and real browser submissions
        run: pnpm test:production

  publish:
    name: Publish versioned images
    needs: production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image prefix
        run: printf 'IMAGE_PREFIX=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Authenticate Docker Hub image downloads
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Configure the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets." >&2
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish images for this commit
        run: |
          for service in api web; do
            image="$IMAGE_PREFIX-$service:$GITHUB_SHA"
            docker build --target "$service" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$image" .
            docker push "$image"
          done

      - name: Record published version
        run: |
          {
            printf 'Published commit: `%s`\n\n' "$GITHUB_SHA"
            printf -- '- `%s-api:%s`\n' "$IMAGE_PREFIX" "$GITHUB_SHA"
            printf -- '- `%s-web:%s`\n' "$IMAGE_PREFIX" "$GITHUB_SHA"
            printf '\nDeployment remains a separate manual workflow.\n'
          } >> "$GITHUB_STEP_SUMMARY"
