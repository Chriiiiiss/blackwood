name: Production integration CI

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/api/**
      - Dockerfile
      - .dockerignore
      - compose.production.yaml
      - deploy/**
      - .env.production.example
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - .env.example
      - tsconfig.base.json
      - biome.json
      - .github/workflows/ci-production.yml
  pull_request:
    paths:
      - apps/web/package.json
      - apps/api/package.json
      - apps/api/drizzle/**
      - Dockerfile
      - .dockerignore
      - compose.production.yaml
      - deploy/**
      - .env.production.example
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - .env.example
      - tsconfig.base.json
      - biome.json
      - .github/workflows/ci-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production containers and real submissions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium dependencies
        run: pnpm --filter @blackwood/web exec playwright install --with-deps chromium

      - name: Verify production containers and real browser submissions
        run: pnpm test:production
