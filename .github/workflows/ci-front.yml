name: Frontend CI

on:
  push:
    branches: [main]
    paths: &frontend-paths
      - apps/web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - .env.example
      - tsconfig.base.json
      - biome.json
      - .github/workflows/ci-front.yml
  pull_request:
    paths: *frontend-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks, browser tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting and lint
        run: pnpm exec biome check apps/web package.json biome.json tsconfig.base.json

      - name: Check frontend types
        run: pnpm --filter @blackwood/web typecheck

      - name: Install browser dependencies
        run: pnpm --filter @blackwood/web exec playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: pnpm test:web

      - name: Build frontend
        run: pnpm --filter @blackwood/web build

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-failure-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
