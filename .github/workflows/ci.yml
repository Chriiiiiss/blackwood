name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://blackwood:ci-only-password@127.0.0.1:5432/blackwood_ci
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: blackwood
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: blackwood_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackwood -d blackwood_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint and types
        run: pnpm check

      - name: Run API unit tests
        run: pnpm test

      - name: Apply migrations to the empty database
        run: pnpm db:migrate

      - name: Run PostgreSQL integration tests
        run: pnpm --filter @blackwood/api test:db

      - name: Install browser dependencies
        run: pnpm --filter @blackwood/web exec playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: pnpm test:web

      - name: Build applications
        run: pnpm build

      - name: Verify production containers and real browser submissions
        run: pnpm test:production

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
