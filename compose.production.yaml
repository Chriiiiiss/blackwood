name: blackwood-production

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    image: ${IMAGE_PREFIX:-blackwood}-api:${APP_VERSION:-local}
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - media_data:/media
    environment: &api-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      MEDIA_ROOT: /media
      API_HOST: 0.0.0.0
      API_PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-https://${SITE_ADDRESS:?Set SITE_ADDRESS}}
      ORGANIZER_PASSWORD_HASH: ${ORGANIZER_PASSWORD_HASH:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      PARTY_OPENS_AT: ${PARTY_OPENS_AT:-2026-10-31T20:00:00.000Z}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    image: ${IMAGE_PREFIX:-blackwood}-web:${APP_VERSION:-local}
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env.production}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  migrate:
    image: ${IMAGE_PREFIX:-blackwood}-api:${APP_VERSION:-local}
    profiles: [tools]
    init: true
    environment: *api-environment
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  media_data:
  postgres_data:
  caddy_data:
  caddy_config:
